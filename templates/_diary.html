<div class="cal-wrap">
<table class="diary-cal">
  <caption class="visually-hidden">일기장이 남아 있는 달</caption>
  <thead><tr><td></td>{% for m in range(1, 13) %}<th scope="col">{{ m }}월</th>{% endfor %}</tr></thead>
  <tbody>
  {% for y in diary_years %}
    <tr><th scope="row">{{ y }}</th>
    {% for m in range(1, 13) %}
      {% set d = diary_map.get('%d-%02d'|format(y, m)) %}
      <td>{% if d %}<a href="{{ view_href(d.ts, d.canon) }}" title="{{ y }}년 {{ m }}월 일기 열기"><span class="visually-hidden">{{ y }}년 </span>{{ m }}<span class="visually-hidden">월</span></a>{% endif %}</td>
    {% endfor %}
    </tr>
  {% endfor %}
  </tbody>
</table>
</div>
