{% extends "base.html" %}
{% block title %}로그인 — {{ cfg.site_title }}{% endblock %}
{% block main %}
<section class="sheet login">
  <h1>로그인</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="name">닉네임</label>
    <input id="name" type="text" name="name" autocomplete="username" required autofocus>
    <label for="pw">비밀번호</label>
    <input id="pw" type="password" name="password" autocomplete="current-password" required>
    <button type="submit">로그인</button>
  </form>
  {% if signup != 'closed' %}<p class="muted">아직 회원이 아니라면 <a href="{{ url_for('community.join') }}">가입</a>{% if signup == 'invite' %}(초대 코드 필요){% endif %}.</p>{% endif %}
</section>
{% endblock %}
